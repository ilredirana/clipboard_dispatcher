name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 / Python 3.12
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: src/requirements*.txt

      - name: Create project environment
        run: python -m venv .venv

      - name: Install development dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r src/requirements-dev.txt

      - name: Check code
        run: .\.venv\Scripts\python.exe -m ruff check .

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q src/tests

      - name: Validate release resources
        run: .\.venv\Scripts\python.exe scripts/validate_release.py

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = & .\.venv\Scripts\python.exe -c "import runpy; print(runpy.run_path('src/app/server/version.py')['APP_VERSION'])"
          if ($LASTEXITCODE -ne 0) { throw '无法读取应用版本' }
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "版本标签 $env:RELEASE_TAG 与应用版本 v$version 不一致"
          }

      - name: Build EXE
        run: ./scripts/build_windows.ps1

      - name: Verify packaged application
        run: .\.venv\Scripts\python.exe scripts/smoke_windows_ci.py

      - name: Generate SHA256
        run: |
          $hash = (Get-FileHash -LiteralPath dist/ClipboardDispatcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ClipboardDispatcher.exe" | Set-Content -LiteralPath dist/ClipboardDispatcher.exe.sha256 -Encoding ascii

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: ClipboardDispatcher-windows-x64
          path: |
            dist/ClipboardDispatcher.exe
            dist/ClipboardDispatcher.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified EXE
        uses: actions/download-artifact@v8
        with:
          name: ClipboardDispatcher-windows-x64
          path: dist

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/ClipboardDispatcher.exe dist/ClipboardDispatcher.exe.sha256 --repo $env:GH_REPO --verify-tag --title "Clipboard Dispatcher $env:RELEASE_TAG" --notes-from-tag --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 发布失败：$env:RELEASE_TAG" }
